name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terminal-checks:
    uses: ./.github/workflows/t8-terminal-checks.yml
    with:
      ref: ${{ github.sha }}
  native-sycl:
    uses: ./.github/workflows/native-sycl.yml
    with:
      ref: ${{ github.sha }}
  native-hip:
    uses: ./.github/workflows/native-hip.yml
    with:
      ref: ${{ github.sha }}
  docker-entrypoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-portable.txt -r requirements-test.txt
      - run: python tools/run_release_checks.py --group posix --strict
  test:
    runs-on: windows-latest
    env:
      # Match the UTF-8 mode used by the portable EXE and batch entry points.
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Check independent node compatibility
        uses: actions/checkout@v4
        with:
          repository: T8mars/Comfyui-Strata-T8
          ref: e56c80048d6d770668a9bb06be7884d6c1de611f # Node 1.3.3 reliability fixes, protocol 1
          path: .portable-build/node-regression
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser video and model-switch logic
        run: node --test tools/test_web_video.cjs
      - run: python -m pip install -r requirements.txt -r requirements-portable.txt -r requirements-test.txt
      - name: Prepare pinned GGUF source dependency (no model download)
        run: python tools/bootstrap_portable.py --gguf-only
      - name: Server, security, update and synchronization tests
        run: python tools/run_release_checks.py --group application
      - name: Independent node integration
        env:
          STRATA_SOURCE_DIR: ${{ github.workspace }}
        run: python -m unittest discover -s .portable-build/node-regression/tests -q
      - name: Setup regression tests
        run: python tools/run_release_checks.py --group setup
