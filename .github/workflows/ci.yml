name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      host_only:
        description: Run focused Windows desktop host and launch checks
        type: boolean
        default: false
      windows_only:
        description: Run Windows application, host, setup and node checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  terminal-checks:
    if: ${{ !inputs.host_only && !inputs.windows_only }}
    uses: ./.github/workflows/t8-terminal-checks.yml
    with:
      ref: ${{ github.sha }}
  native-sycl:
    if: ${{ !inputs.host_only && !inputs.windows_only }}
    uses: ./.github/workflows/native-sycl.yml
    with:
      ref: ${{ github.sha }}
  native-hip:
    if: ${{ !inputs.host_only && !inputs.windows_only }}
    uses: ./.github/workflows/native-hip.yml
    with:
      ref: ${{ github.sha }}
  docker-entrypoint:
    if: ${{ !inputs.host_only && !inputs.windows_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-portable.txt -r requirements-test.txt
      - run: python tools/run_release_checks.py --group posix --strict
  test:
    if: ${{ !inputs.host_only }}
    runs-on: windows-latest
    env:
      # Match the UTF-8 mode used by the portable EXE and batch entry points.
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Check independent node compatibility
        uses: actions/checkout@v4
        with:
          repository: T8mars/Comfyui-Strata-T8
          ref: e56c80048d6d770668a9bb06be7884d6c1de611f # Node 1.3.3 reliability fixes, protocol 1
          path: .portable-build/node-regression
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: Install browser test dependency
        run: npm install --prefix .portable-build/webtest --ignore-scripts --no-audit --no-fund puppeteer-core
      - name: Browser video and model-switch logic
        run: node --test tools/test_web_video.cjs
      - run: python -m pip install -r requirements.txt -r requirements-portable.txt -r requirements-test.txt
      - name: Prepare pinned GGUF source dependency (no model download)
        run: python tools/bootstrap_portable.py --gguf-only
      - name: Server, security, update and synchronization tests
        env:
          WEBTEST_MODULES: ${{ github.workspace }}/.portable-build/webtest
        run: python tools/run_release_checks.py --group application
      - name: Install desktop host dependencies
        working-directory: apps/host
        run: npm ci
      - name: Desktop host regression
        working-directory: apps/host
        env:
          STRATA_PYTHON: ${{ env.pythonLocation }}/python.exe
        run: npm test
      - name: Desktop host typecheck
        working-directory: apps/host
        run: npm run typecheck
      - name: Desktop host production build
        working-directory: apps/host
        run: npm run build
      - name: Independent node integration
        env:
          STRATA_SOURCE_DIR: ${{ github.workspace }}
        run: python -m unittest discover -s .portable-build/node-regression/tests -q
      - name: Setup regression tests
        run: python tools/run_release_checks.py --group setup
  desktop-host:
    if: ${{ inputs.host_only }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      WT_SESSION: strata-tests
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - run: python -m pip install -r requirements.txt -r requirements-portable.txt -r requirements-test.txt
      - run: python tools/bootstrap_portable.py --gguf-only
      - name: Launch preset regression
        shell: pwsh
        run: |
          Remove-Item Env:NO_COLOR -ErrorAction SilentlyContinue
          python -m pytest tests/terminal/test_launch.py::PresetStore -q --tb=short
          exit $LASTEXITCODE
      - name: Install desktop host dependencies
        working-directory: apps/host
        run: npm ci
      - name: Desktop host regression
        working-directory: apps/host
        env:
          STRATA_PYTHON: ${{ env.pythonLocation }}/python.exe
        run: npm test
      - name: Desktop host typecheck
        working-directory: apps/host
        run: npm run typecheck
      - name: Desktop host production build
        working-directory: apps/host
        run: npm run build
