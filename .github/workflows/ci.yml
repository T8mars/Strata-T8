name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check independent node compatibility
        uses: actions/checkout@v4
        with:
          repository: T8mars/Comfyui-Strata-T8
          ref: 0452eb109136fe0c1958d5133612a5af7f31df0e # Node 1.0.5
          path: .portable-build/node-regression
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-portable.txt
      - name: Server, security, update and synchronization tests
        run: python -m unittest serve.test_server serve.test_security serve.test_responses serve.test_structured serve.test_runconfig serve.test_lifecycle serve.test_vision_lifecycle tools.test_portable_entries tools.test_portable_audit tools.test_portable_weights tools.test_portable_windows tools.test_windows_utf8_manifest tools.test_portable_launcher tools.test_portable_update tools.test_portable_round2 tools.test_portable_round3 tools.test_portable_round4 tools.test_portable_update_round4 tools.test_portable_round5 tools.test_portable_update_round5 tools.test_portable_schema_round5 tools.test_portable_round6 tools.test_portable_config_round6 tools.test_portable_update_round6 tools.test_sync_upstream tools.test_model_sources tools.test_setup_update -q
      - name: Independent node integration
        env:
          STRATA_SOURCE_DIR: ${{ github.workspace }}
        run: python -m unittest discover -s .portable-build/node-regression/tests -q
      - name: Setup regression tests
        run: python -m unittest discover -s tools -p 'test_setup_*.py' -q
