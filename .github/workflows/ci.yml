name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-portable.txt
      - name: Server, security, update and synchronization tests
        run: python -m unittest serve.test_server serve.test_security serve.test_responses serve.test_runconfig serve.test_lifecycle serve.test_vision_lifecycle tools.test_comfyui_nodes tools.test_portable_weights tools.test_portable_windows tools.test_portable_launcher tools.test_portable_update tools.test_sync_upstream tools.test_model_sources tools.test_setup_update -q
      - name: Setup regression tests
        run: python -m unittest discover -s tools -p 'test_setup_*.py' -q
