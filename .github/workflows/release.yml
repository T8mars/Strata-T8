name: Build portable release
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tested branch or commit to package
        type: string
        default: main
  workflow_call:
    inputs:
      ref:
        type: string
        default: main
permissions:
  contents: write
concurrency:
  group: portable-release
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.freeze.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - id: freeze
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  hip-compile:
    needs: source
    uses: ./.github/workflows/native-hip.yml
    with:
      ref: ${{ needs.source.outputs.commit }}
    permissions:
      contents: read
  release:
    needs: [source, hip-compile]
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
      - name: Check independent node compatibility
        uses: actions/checkout@v4
        with:
          repository: T8mars/Comfyui-Strata-T8
          ref: 2e53bf09ffc3d9c436ab3716de3b07b47996a58a # Node 1.1.1, video fixes and protocol 1
          path: .portable-build/node-regression
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser video and model-switch logic
        run: node --test tools/test_web_video.cjs
      - name: Set up portable MSVC compiler
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
          vsversion: '2022'
      - name: Install pinned CUDA toolkit for native video builds
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: '13.0.2'
          method: network
          sub-packages: '["nvcc", "crt", "nvvm", "nvptxcompiler", "thrust", "cudart", "cublas", "cublas_dev", "cuobjdump", "nvrtc", "nvrtc_dev"]'
      - name: Build independent runtime with matching engines
        run: python tools/bootstrap_portable.py
      - name: Verify self-built native engine identity and contracts
        run: |
          runtime/python/python.exe -X utf8 tools/build_native_portable.py --verify
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          runtime/python/python.exe -X utf8 -m unittest discover -s tools -p test_native_build.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Download and verify pinned vision encoder
        run: runtime/python/python.exe -X utf8 tools/prepare_portable_vision.py
      - name: Validate runtime and application
        run: |
          runtime/python/python.exe -X utf8 tools/run_release_checks.py --group application --strict
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          runtime/python/python.exe -X utf8 tools/run_release_checks.py --group setup --strict
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          runtime/python/python.exe -X utf8 -c "import portable; portable.environment_check()"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Independent node integration
        env:
          STRATA_SOURCE_DIR: ${{ github.workspace }}
        run: runtime/python/python.exe -X utf8 tools/run_release_checks.py --group nodes --node-tests .portable-build/node-regression/tests --strict
      - name: Package and audit
        run: |
          runtime/python/python.exe -X utf8 -u tools/build_portable.py --edition VisionReady-NoMainModel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          runtime/python/python.exe -X utf8 -u tools/build_portable.py --edition Portable-NoModels
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Publish verified assets
        run: runtime/python/python.exe -X utf8 -u tools/publish_portable_release.py
      - name: Preserve native build failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-build-failure-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .portable-build/t8-native/engine-configure.log
            .portable-build/t8-native/engine-build.log
            .portable-build/t8-native/vision-configure.log
            .portable-build/t8-native/vision-build.log
            .portable-build/t8-native/native-contract.log
            .portable-build/t8-native/engine-portable/CMakeFiles/CMakeConfigureLog.yaml
            .portable-build/t8-native/vision-portable/CMakeFiles/CMakeConfigureLog.yaml
