name: Build portable release
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tested branch or commit to package
        type: string
        default: main
  workflow_call:
    inputs:
      ref:
        type: string
        default: main
permissions:
  contents: write
concurrency:
  group: portable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0
      - name: Check independent node compatibility
        uses: actions/checkout@v4
        with:
          repository: T8mars/Comfyui-Strata-T8
          ref: 867e833db18eee3c8a85350d645124daef7a514f # Node 1.0.4
          path: .portable-build/node-regression
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build independent runtime with matching engines
        run: python tools/bootstrap_portable.py
      - name: Download and verify pinned vision encoder
        run: runtime/python/python.exe -X utf8 tools/prepare_portable_vision.py
      - name: Validate runtime and application
        run: |
          runtime/python/python.exe -X utf8 -m unittest serve.test_server serve.test_security serve.test_responses serve.test_structured serve.test_runconfig serve.test_lifecycle serve.test_vision_lifecycle tools.test_portable_entries tools.test_portable_audit tools.test_portable_weights tools.test_portable_windows tools.test_windows_utf8_manifest tools.test_portable_launcher tools.test_portable_update tools.test_portable_round2 tools.test_portable_round3 tools.test_portable_round4 tools.test_portable_update_round4 tools.test_portable_round5 tools.test_portable_update_round5 tools.test_portable_schema_round5 tools.test_portable_round6 tools.test_portable_config_round6 tools.test_portable_update_round6 tools.test_sync_upstream tools.test_model_sources tools.test_setup_update -q
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          runtime/python/python.exe -X utf8 -m unittest discover -s tools -p 'test_setup_*.py' -q
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          runtime/python/python.exe -X utf8 -c "import portable; portable.environment_check()"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Independent node integration
        env:
          STRATA_SOURCE_DIR: ${{ github.workspace }}
        run: runtime/python/python.exe -X utf8 -m unittest discover -s .portable-build/node-regression/tests -q
      - name: Package and audit
        run: |
          runtime/python/python.exe -X utf8 -u tools/build_portable.py --edition VisionReady-NoMainModel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          runtime/python/python.exe -X utf8 -u tools/build_portable.py --edition Portable-NoModels
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Publish verified assets
        shell: pwsh
        run: |
          $meta = Get-Content meta.json -Raw | ConvertFrom-Json
          $tag = 'v' + $meta.version
          $assets = Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(zip|sha256)$' }
          $existing = gh release view $tag --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing -eq 'false') {
            Write-Host "Published release $tag already exists; preserving its assets."
            exit 0
          }
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --target (git rev-parse HEAD) --title "Strata-T8 $($meta.version)" --notes-file RELEASE-NOTES.md
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          gh release upload $tag @($assets.FullName) --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
