name: Sync upstream
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Upstream source for a tested review candidate
        type: choice
        options: [release, main]
        default: release
permissions:
  contents: write
concurrency:
  group: upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      commit: ${{ steps.sync.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Create isolated review candidate
        run: git switch -c codex/upstream-review-${{ github.run_id }}
      - name: Merge upstream
        id: sync
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_SOURCE: ${{ inputs.source || 'release' }}
        run: python tools/sync_upstream.py --source $env:SYNC_SOURCE
      - name: Check independent node compatibility
        if: steps.sync.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: T8mars/Comfyui-Strata-T8
          ref: e56c80048d6d770668a9bb06be7884d6c1de611f # Node 1.3.3, protocol 1
          path: .portable-build/node-regression
      - name: Install test dependencies
        if: steps.sync.outputs.changed == 'true'
        run: python -m pip install -r requirements.txt -r requirements-portable.txt -r requirements-test.txt
      - uses: actions/setup-node@v4
        if: steps.sync.outputs.changed == 'true'
        with:
          node-version: '22'
      - name: Browser video and model-switch logic
        if: steps.sync.outputs.changed == 'true'
        run: node --test tools/test_web_video.cjs
      - name: Validate merged source
        if: steps.sync.outputs.changed == 'true'
        run: |
          python tools/bootstrap_portable.py --gguf-only
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/run_release_checks.py --group application
      - name: Independent node integration
        if: steps.sync.outputs.changed == 'true'
        env:
          STRATA_SOURCE_DIR: ${{ github.workspace }}
        run: python -m unittest discover -s .portable-build/node-regression/tests -q
      - name: Setup regression tests
        if: steps.sync.outputs.changed == 'true'
        run: python tools/run_release_checks.py --group setup
      - name: Preserve tested review candidate
        id: candidate
        if: steps.sync.outputs.changed == 'true'
        run: python tools/sync_upstream.py --export-candidate ${{ steps.sync.outputs.base_commit }}
      - name: Push tested review candidate without workflow changes
        if: steps.sync.outputs.changed == 'true' && steps.candidate.outputs.workflow_changes != 'true'
        env:
          SYNC_SOURCE: ${{ inputs.source || 'release' }}
        run: |
          python tools/check_private_paths.py --ref HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git push origin HEAD
      - name: Explain required workflow review
        if: steps.candidate.outputs.workflow_changes == 'true'
        shell: pwsh
        run: |
          Write-Output '::warning::Tested candidate changes GitHub workflows. The default token cannot push it. Download the verified candidate bundle for review; main and releases are unchanged.'
          '### Upstream candidate requires workflow review' >> $env:GITHUB_STEP_SUMMARY
          'Tests passed. The candidate is preserved in the artifact with its base/head commits and SHA256. No stable branch or release was updated.' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always() && (failure() || steps.sync.outputs.changed == 'true')
        with:
          name: upstream-sync-diagnostics
          path: |
            .portable-build/upstream-conflict.json
            .portable-build/upstream-candidate.json
            .portable-build/upstream-candidate.bundle
          if-no-files-found: ignore
