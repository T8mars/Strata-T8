name: Sync upstream
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Upstream branch to merge (main does not publish automatically)
        type: choice
        options: [release, main]
        default: release
permissions:
  contents: write
concurrency:
  group: upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: windows-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      commit: ${{ steps.sync.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Create preview branch for upstream main
        if: inputs.source == 'main'
        run: git switch -c codex/upstream-main-${{ github.run_id }}
      - name: Merge upstream
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_SOURCE: ${{ inputs.source || 'release' }}
        run: python tools/sync_upstream.py --source $env:SYNC_SOURCE
      - name: Check independent node compatibility
        if: steps.sync.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: T8mars/Comfyui-Strata-T8
          ref: 3032d17eb7aedd2a0728d5073640e309464c46f2 # Node 1.0.6, native 0.1.40.2 compatibility tests
          path: .portable-build/node-regression
      - name: Install test dependencies
        if: steps.sync.outputs.changed == 'true'
        run: python -m pip install -r requirements.txt -r requirements-portable.txt
      - name: Validate merged source
        if: steps.sync.outputs.changed == 'true'
        run: |
          python tools/bootstrap_portable.py --gguf-only
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/run_release_checks.py --group application
      - name: Independent node integration
        if: steps.sync.outputs.changed == 'true'
        env:
          STRATA_SOURCE_DIR: ${{ github.workspace }}
        run: python -m unittest discover -s .portable-build/node-regression/tests -q
      - name: Setup regression tests
        if: steps.sync.outputs.changed == 'true'
        run: python tools/run_release_checks.py --group setup
      - name: Push tested merge
        if: steps.sync.outputs.changed == 'true'
        env:
          SYNC_SOURCE: ${{ inputs.source || 'release' }}
        run: |
          python tools/check_private_paths.py --ref HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:SYNC_SOURCE -eq 'main') { git push origin HEAD }
          else { git push origin HEAD:main }
      - name: Preserve conflict branch
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path '.portable-build/upstream-conflict.json') {
            $report = Get-Content '.portable-build/upstream-conflict.json' -Raw | ConvertFrom-Json
            python tools/check_private_paths.py --ref $report.branch
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            git push origin $report.branch
          }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: upstream-sync-diagnostics
          path: .portable-build/upstream-conflict.json
          if-no-files-found: ignore
  release:
    needs: sync
    if: needs.sync.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.source == 'release')
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.sync.outputs.commit }}
    secrets: inherit
