name: Sync upstream
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Upstream source for a tested review candidate
        type: choice
        options: [release, main]
        default: release
permissions:
  contents: write
concurrency:
  group: upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: windows-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      commit: ${{ steps.sync.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Create isolated review candidate
        run: git switch -c codex/upstream-review-${{ github.run_id }}
      - name: Merge upstream
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_SOURCE: ${{ inputs.source || 'release' }}
        run: python tools/sync_upstream.py --source $env:SYNC_SOURCE
      - name: Check independent node compatibility
        if: steps.sync.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: T8mars/Comfyui-Strata-T8
          ref: 4047e00323cc2b1855a522fa37202bc71a39a05b # Node 1.3.2, protocol 1
          path: .portable-build/node-regression
      - name: Install test dependencies
        if: steps.sync.outputs.changed == 'true'
        run: python -m pip install -r requirements.txt -r requirements-portable.txt -r requirements-test.txt
      - uses: actions/setup-node@v4
        if: steps.sync.outputs.changed == 'true'
        with:
          node-version: '22'
      - name: Browser video and model-switch logic
        if: steps.sync.outputs.changed == 'true'
        run: node --test tools/test_web_video.cjs
      - name: Validate merged source
        if: steps.sync.outputs.changed == 'true'
        run: |
          python tools/bootstrap_portable.py --gguf-only
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/run_release_checks.py --group application
      - name: Independent node integration
        if: steps.sync.outputs.changed == 'true'
        env:
          STRATA_SOURCE_DIR: ${{ github.workspace }}
        run: python -m unittest discover -s .portable-build/node-regression/tests -q
      - name: Setup regression tests
        if: steps.sync.outputs.changed == 'true'
        run: python tools/run_release_checks.py --group setup
      - name: Push tested review candidate
        if: steps.sync.outputs.changed == 'true'
        env:
          SYNC_SOURCE: ${{ inputs.source || 'release' }}
        run: |
          python tools/check_private_paths.py --ref HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git push origin HEAD
      - name: Preserve conflict branch
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path '.portable-build/upstream-conflict.json') {
            $report = Get-Content '.portable-build/upstream-conflict.json' -Raw | ConvertFrom-Json
            python tools/check_private_paths.py --ref $report.branch
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            git push origin $report.branch
          }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: upstream-sync-diagnostics
          path: .portable-build/upstream-conflict.json
          if-no-files-found: ignore
