name: Sync upstream
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Upstream branch to merge (main does not publish automatically)
        type: choice
        options: [release, main]
        default: release
permissions:
  contents: write
concurrency:
  group: upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: windows-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Create preview branch for upstream main
        if: inputs.source == 'main'
        run: git switch -c codex/upstream-main-${{ github.run_id }}
      - name: Merge upstream
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_SOURCE: ${{ inputs.source || 'release' }}
        run: python tools/sync_upstream.py --source $env:SYNC_SOURCE
      - name: Check independent node compatibility
        if: steps.sync.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: T8mars/Comfyui-Strata-T8
          ref: 0452eb109136fe0c1958d5133612a5af7f31df0e # Node 1.0.5
          path: .portable-build/node-regression
      - name: Install test dependencies
        if: steps.sync.outputs.changed == 'true'
        run: python -m pip install -r requirements.txt -r requirements-portable.txt
      - name: Validate merged source
        if: steps.sync.outputs.changed == 'true'
        run: python -m unittest serve.test_server serve.test_security serve.test_responses serve.test_structured serve.test_runconfig serve.test_lifecycle serve.test_vision_lifecycle tools.test_portable_entries tools.test_portable_audit tools.test_portable_weights tools.test_portable_windows tools.test_windows_utf8_manifest tools.test_portable_launcher tools.test_portable_update tools.test_portable_round2 tools.test_portable_round3 tools.test_portable_round4 tools.test_portable_update_round4 tools.test_portable_round5 tools.test_portable_update_round5 tools.test_portable_schema_round5 tools.test_portable_round6 tools.test_portable_config_round6 tools.test_portable_update_round6 tools.test_sync_upstream tools.test_model_sources tools.test_setup_update -q
      - name: Independent node integration
        if: steps.sync.outputs.changed == 'true'
        env:
          STRATA_SOURCE_DIR: ${{ github.workspace }}
        run: python -m unittest discover -s .portable-build/node-regression/tests -q
      - name: Setup regression tests
        if: steps.sync.outputs.changed == 'true'
        run: python -m unittest discover -s tools -p 'test_setup_*.py' -q
      - name: Push tested merge
        if: steps.sync.outputs.changed == 'true'
        env:
          SYNC_SOURCE: ${{ inputs.source || 'release' }}
        run: |
          if ($env:SYNC_SOURCE -eq 'main') { git push origin HEAD }
          else { git push origin HEAD:main }
      - name: Preserve conflict branch
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path '.portable-build/upstream-conflict.json') {
            $report = Get-Content '.portable-build/upstream-conflict.json' -Raw | ConvertFrom-Json
            git push origin $report.branch
          }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: upstream-sync-diagnostics
          path: .portable-build/upstream-conflict.json
          if-no-files-found: ignore
  release:
    needs: sync
    if: needs.sync.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.source == 'release')
    uses: ./.github/workflows/release.yml
    with:
      ref: main
    secrets: inherit
