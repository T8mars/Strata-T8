name: T8 Terminal and model-pack checks
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: main
  workflow_dispatch:
    inputs:
      ref:
        type: string
        default: main
permissions:
  contents: read
jobs:
  terminal:
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      PYTHONUTF8: '1'
      WT_SESSION: strata-tests
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-portable.txt pytest
      - run: python tools/bootstrap_portable.py --gguf-only
      - name: Terminal lifecycle, settings and packaged runtime
        shell: pwsh
        run: |
          Remove-Item Env:NO_COLOR -ErrorAction SilentlyContinue
          python -m pytest tests/terminal --import-mode=importlib -q --tb=short
          exit $LASTEXITCODE
  model-packs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt safetensors==0.8.0 pytest
      - run: python tools/run_release_checks.py --group model-packs --strict
      - run: python -m pytest tools/test_nvfp4_local_pack.py -q
